[package]
name = "pages"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
yew_flight_indicators = { path = "..", default-features = false, features = ["leafy"] }
# Leafy, under yew's name.
yew = { package = "leafy", version = "0.1" }
web-sys = { version = "0.3", features = ["Performance", "Window"] }
gloo-render = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "debuginfo"
